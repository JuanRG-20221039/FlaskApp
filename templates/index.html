<!DOCTYPE html>
<html>
<head>
  <title>Clasificador de Flores Iris</title>
  <script>
    function clasificarFlor(event) {
      event.preventDefault();

      const sepalLength = parseFloat(document.getElementById('sepal_length').value);
      const sepalWidth = parseFloat(document.getElementById('sepal_width').value);
      const petalLength = parseFloat(document.getElementById('petal_length').value);
      const petalWidth = parseFloat(document.getElementById('petal_width').value);

      fetch('/predict', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          features: [sepalLength, sepalWidth, petalLength, petalWidth]
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          document.getElementById('resultado').innerText = 'Error: ' + data.error;
        } else {
          document.getElementById('resultado').innerText = 'La flor fue clasificada como: ' + data.prediction;
        }
      })
      .catch(error => {
        document.getElementById('resultado').innerText = 'Error en la solicitud.';
        console.error('Error:', error);
      });
    }
  </script>
</head>
<body>
  <h1>Clasificador de Flores Iris</h1>
  <form id="formulario" onsubmit="clasificarFlor(event)">
    <label for="sepal_length">Longitud del Sépalo (cm):</label>
    <input type="text" id="sepal_length" name="sepal_length"><br><br>

    <label for="sepal_width">Ancho del Sépalo (cm):</label>
    <input type="text" id="sepal_width" name="sepal_width"><br><br>

    <label for="petal_length">Longitud del Pétalo (cm):</label>
    <input type="text" id="petal_length" name="petal_length"><br><br>

    <label for="petal_width">Ancho del Pétalo (cm):</label>
    <input type="text" id="petal_width" name="petal_width"><br><br>

    <input type="submit" value="Enviar">
  </form>

  <p id="resultado"></p>
</body>
</html>
